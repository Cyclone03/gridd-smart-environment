# Intégration continue : chaque application est vérifiée et construite
# séparément, sans dépendre de l'autre.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DEBUG: "false"
      DB_ENGINE: sqlite
      REDIS_URL: ""
      LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Vérifier la configuration Django
        run: python manage.py check --deploy --fail-level ERROR
      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test core --noinput

  web:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image du frontend
        run: docker build -t gridd-web:ci web
      - name: Construire l'image de l'API
        run: docker build -t gridd-api:ci apps/api
      - name: Démarrer le frontend seul et vérifier /healthz
        run: |
          docker run -d --name web -p 3000:3000 -e GRIDD_API_URL=https://api.example.org gridd-web:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          curl -fsS http://localhost:3000/env.js | grep -q api.example.org
