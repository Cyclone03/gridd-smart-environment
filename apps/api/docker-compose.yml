
services:
  gridd_api:
    image: ${GRIDD_IMAGE:-gridd-api:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    # depends_on:
    #   redis:
    #     condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  gridd_kafka:
    image: ${GRIDD_IMAGE:-gridd-api:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command:
      - python
      - manage.py
      - run_consumers
    # depends_on:
    #   redis:
    #     condition: service_healthy

