# Démarrage autonome de l'API GRIDD et de ses dépendances.
#

services:
  api:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy

  kafka-consumer:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    restart: unless-stopped
    env_file:
      - .env
    # volumes:
    #   - ./secrets:/app/secrets:ro
    command: ["python", "manage.py", "consume_kafka"]
    # Pas de contrôle HTTP : processus de consommation sans port exposé.
    # healthcheck:
    #   disable: true
    depends_on:
      api:
        condition: service_healthy

