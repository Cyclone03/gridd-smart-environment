
# Démarrage autonome du backend GRIDD : API, consommateurs Kafka et module IA.
# Chemins relatifs à la racine du dépôt (comme dans Dokploy).
# Deux images construites depuis apps/api (docker/Dockerfile) :
#   cible « api » : api et kafka-consumer ;
#   cible « ia »  : ai-prediction (TensorFlow, scikit-learn).

services:
  api:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    ports:
      # API_BIND=127.0.0.1 si le proxy (Caddy, nginx, cloudflared…) tourne sur
      # la même machine : le port n'est alors plus exposé à Internet (robots
      # qui interrogent l'IP brute, contournement de Cloudflare).
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ../files/gridd-kafka-ca.crt:/app/secrets/gridd-kafka-ca.crt:ro

  kafka-consumer:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    # build:
    #   context: ./apps/api
    #   dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    volumes:
      - ../files/gridd-kafka-ca.crt:/app/secrets/gridd-kafka-ca.crt:ro
    command: ["python", "manage.py", "run_consumers"]
    # Fichier mis à jour toutes les 10 s tant que tous les modules avancent ;
    # un module bloqué plus de KAFKA_CONSUMER_STALL_SECONDS arrête le processus
    # (redémarré par « restart: unless-stopped »).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; f = os.environ.get('KAFKA_CONSUMER_HEARTBEAT_FILE', '/tmp/gridd-consumers.heartbeat'); sys.exit(0 if time.time() - os.path.getmtime(f) < 120 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy

  ai-prediction:
    image: ${GRIDD_IA_IMAGE:-gridd-ia:latest}
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile
      target: ia
    init: true
    restart: unless-stopped
    # Laisse le cycle en cours se terminer à l'arrêt (SIGTERM).
    stop_grace_period: 2m
    env_file:
      - apps/api/.env
    # « environment » l'emporte sur env_file : ces valeurs propres à l'image IA
    # ne peuvent pas être écrasées par erreur par apps/api/.env.
    environment:
      # Publication confirmée sur le Kafka partagé, persistée par kafka-consumer.
      EVENT_BUS: kafka
      RUN_MIGRATIONS: "false"
      AI_ISOLATED_ENVIRONMENT: "true"
      AI_STATE_DIR: /var/lib/ai-predictions
      AI_PREDICTION_LEDGER_PATH: /var/lib/ai-predictions/predictions.sqlite3
      AI_PREDICTION_HEARTBEAT_PATH: /var/lib/ai-predictions/heartbeat
      AI_ARTIFACT_MANIFEST_PATH: /app/modules/ia/artifacts/manifest.json
    command: ["python", "manage.py", "run_ai_predictions"]
    volumes:
      - ../files/gridd-kafka-ca.crt:/app/secrets/gridd-kafka-ca.crt:ro
      # Registre des prédictions publiées et battement de cœur : doit survivre
      # aux redéploiements (sinon une prédiction peut être republiée).
      - ai-prediction-state:/var/lib/ai-predictions
    healthcheck:
      test: ["CMD", "python", "manage.py", "ai_prediction_healthcheck"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 300s
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai-prediction-state:
