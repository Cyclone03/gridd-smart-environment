
# Démarrage autonome de l'API GRIDD et du consommateur Kafka.

services:
  api:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  kafka-consumer:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "manage.py", "consume_kafka"]
    depends_on:
      api:
        condition: service_healthy
