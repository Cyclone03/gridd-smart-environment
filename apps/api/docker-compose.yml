# Démarrage autonome de l'API GRIDD et de ses dépendances.
#
#   cp .env.example .env      # puis renseigner DJANGO_SECRET_KEY, etc.
#   docker compose up -d --build
#   docker compose --profile kafka up -d     # + consumer Kafka réel
#
# Base PostgreSQL ou Redis externes : renseigner CONTAINER_DB_HOST,
# CONTAINER_DB_PORT et CONTAINER_REDIS_URL dans .env, puis lancer
#   docker compose up -d --no-deps api
name: gridd-api

# Adresses vues depuis les conteneurs. Elles remplacent DB_HOST, DB_PORT et
# REDIS_URL du fichier .env, qui visent l'exécution hors Docker (localhost).
x-api-env: &api-env
  DB_ENGINE: postgres
  DB_HOST: ${CONTAINER_DB_HOST:-postgres}
  DB_PORT: ${CONTAINER_DB_PORT:-5432}
  REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379/0}

services:
  api:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  kafka-consumer:
    image: ${GRIDD_API_IMAGE:-gridd-api:latest}
    profiles: ["kafka"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      KAFKA_CA_CERT_PATH: /app/secrets/gridd-kafka-ca.crt
    volumes:
      - ./secrets:/app/secrets:ro
    command: ["python", "manage.py", "consume_kafka"]
    # Pas de contrôle HTTP : processus de consommation sans port exposé.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gridd}
      POSTGRES_USER: ${DB_USER:-gridd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
    ports:
      - "${DB_PORT_PUBLISHED:-5433}:5432"
    volumes:
      - gridd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Publié pour l'exécution de Django hors Docker (développement local).
    ports:
      - "${REDIS_PORT_PUBLISHED:-6379}:6379"
    volumes:
      - gridd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gridd_postgres_data:
  gridd_redis_data:
