# Démarrage indépendant du frontend GRIDD (le backend n'est pas requis pour
# démarrer ; seules les fonctionnalités qui lisent l'API en dépendent).
#
#   cp .env.example .env        # renseigner GRIDD_API_URL
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
name: gridd-web

services:
  gridd-web:
    image: ${GRIDD_WEB_IMAGE:-gridd-web:latest}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Adresse de l'API vue par le navigateur ; modifiable sans recompiler.
      GRIDD_API_URL: ${GRIDD_API_URL:-}
      GRIDD_WS_URL: ${GRIDD_WS_URL:-}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
