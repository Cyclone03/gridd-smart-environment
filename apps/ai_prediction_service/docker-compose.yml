services:
  ai-prediction:
    image: ${AI_PREDICTION_IMAGE:-gridd-ai-prediction-service:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    env_file:
      - .env
    volumes:
      - ai-prediction-state:/var/lib/ai-predictions
    networks:
      - gridd-backend

networks:
    - dokploy-network
    - default

