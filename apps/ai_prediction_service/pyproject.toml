[project]
name = "gridd-ai-prediction-service"
version = "0.1.0"
description = "Collecte des observations GRIDD et des données Open-Meteo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "confluent-kafka>=2.6,<3"]

[project.optional-dependencies]
inference = [
    "tensorflow==2.21.0",
    "keras==3.15.1",
    "scikit-learn==1.9.1",
    "joblib>=1.5,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
