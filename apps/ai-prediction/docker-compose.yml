services:
  ai-prediction:
    image: ${AI_PREDICTION_IMAGE:-gridd-ai-prediction-service:local}
    build:
      context: apps/ai-prediction
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    env_file:
      - apps/ai-prediction/.env
    volumes:
      - ai-prediction-state:/var/lib/ai-predictions
      - ../files/gridd-kafka-ca.crt:/app/secrets/gridd-kafka-ca.crt:ro
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  ai-prediction-state: