services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: gridd
      POSTGRES_USER: gridd
      POSTGRES_PASSWORD: gridd_dev

    ports:
      - "5433:5432"

    volumes:
      - gridd_postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine

    container_name: gridd-django-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - gridd_redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

      interval: 5s
      timeout: 3s
      retries: 10


volumes:

  gridd_postgres_data:

  gridd_redis_data: